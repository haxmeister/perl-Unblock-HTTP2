name: test

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            perl: '5.16'
          - os: ubuntu-latest
            perl: 'latest'
          - os: macos-latest
            perl: 'latest'
          - os: windows-latest
            perl: 'latest'

    defaults:
      run:
        shell: bash

    steps:
      - uses: actions/checkout@v4

      - name: Set up Perl
        uses: shogo82148/actions-setup-perl@v1
        with:
          perl-version: ${{ matrix.perl }}

      - name: Install nghttp2 development files on Linux
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libnghttp2-dev pkg-config

      - name: Install nghttp2 development files on macOS
        if: runner.os == 'macOS'
        run: brew install nghttp2 pkg-config

      - name: Install dependencies
        run: |
          cpanm --notest Net::HTTP2::nghttp2
          cpanm --notest Uniform::HTTP@0.04
          cpanm --notest --installdeps .

      - name: Build and test
        run: |
          perl Makefile.PL
          MAKE=$(perl -MConfig -e 'print $Config{make}')
          "$MAKE" test

      - name: Check POD syntax
        run: |
          podchecker lib/Unblock/HTTP2.pm
          podchecker lib/Unblock/HTTP2/Client.pm
          podchecker lib/Unblock/HTTP2/Server.pm
          podchecker lib/Unblock/HTTP2/Stream.pm
