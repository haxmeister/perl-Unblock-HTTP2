name: test

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            perl: '5.16'
            distribution: default
          - os: ubuntu-latest
            perl: 'latest'
            distribution: default
          - os: macos-latest
            perl: 'latest'
            distribution: default
          - os: windows-latest
            perl: '5.40'
            distribution: strawberry

    steps:
      - uses: actions/checkout@v4

      - name: Set up Perl
        uses: shogo82148/actions-setup-perl@v1
        with:
          perl-version: ${{ matrix.perl }}
          distribution: ${{ matrix.distribution }}

      - name: Install nghttp2 development files on Linux
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y libnghttp2-dev pkg-config

      - name: Install nghttp2 development files on macOS
        if: runner.os == 'macOS'
        shell: bash
        run: brew install nghttp2 pkg-config

      - name: Install dependencies
        if: runner.os != 'Windows'
        shell: bash
        run: |
          cpanm --notest Alien::nghttp2
          cpanm --notest Uniform::HTTP@0.06
          cpanm --notest --installdeps .

      - name: Install dependencies on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          cpanm -v --notest Alien::nghttp2
          cpanm --notest Uniform::HTTP@0.06
          cpanm --notest --installdeps .

      - name: Build and test
        if: runner.os != 'Windows'
        shell: bash
        run: |
          perl Makefile.PL
          MAKE=$(perl -MConfig -e 'print $Config{make}')
          "$MAKE" test

      - name: Build and test on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          perl Makefile.PL
          perl -MConfig -e 'system($Config{make}, "test"); exit($? >> 8)'

      - name: Check distribution and disttest
        if: runner.os == 'Linux' && matrix.perl == 'latest'
        shell: bash
        run: |
          MAKE=$(perl -MConfig -e 'print $Config{make}')
          "$MAKE" distcheck
          "$MAKE" disttest

      - name: Check installed NativeABI
        if: runner.os == 'Linux' && matrix.perl == 'latest'
        shell: bash
        run: |
          MAKE=$(perl -MConfig -e 'print $Config{make}')
          "$MAKE" dist

          DIST="$PWD/Unblock-HTTP2-0.11.tar.gz"
          test -f "$DIST"

          WORK="$RUNNER_TEMP/unblock-http2-nativeabi-dist"
          INSTALL="$RUNNER_TEMP/unblock-http2-nativeabi-install"

          rm -rf "$WORK" "$INSTALL"
          mkdir -p "$WORK" "$INSTALL"

          tar -xzf "$DIST" -C "$WORK"
          cd "$WORK/Unblock-HTTP2-0.11"

          perl Makefile.PL INSTALL_BASE="$INSTALL"
          "$MAKE"
          "$MAKE" install

          ARCH=$(perl -MConfig -e 'print $Config{archname}')
          export PERL5LIB="$INSTALL/lib/perl5:$INSTALL/lib/perl5/$ARCH"

          cd "$GITHUB_WORKSPACE"
          UNBLOCK_HTTP2_INSTALL_ROOT="$INSTALL" perl xt/installed-nativeabi.t

      - name: Smoke-test optional framework examples
        if: runner.os == 'Linux' && matrix.perl == 'latest'
        shell: bash
        run: |
          cpanm --notest IO::Async AnyEvent
          bash .github/scripts/smoke-http2-examples.sh

      - name: Check POD syntax
        if: runner.os != 'Windows'
        shell: bash
        run: |
          podchecker lib/Unblock/HTTP2.pm
          podchecker lib/Unblock/HTTP2/Integration.pm
          podchecker lib/Unblock/HTTP2/Client.pm
          podchecker lib/Unblock/HTTP2/NativeABI.pm
          podchecker lib/Unblock/HTTP2/Server.pm
          podchecker lib/Unblock/HTTP2/Transaction.pm

      - name: Check POD syntax on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          podchecker lib/Unblock/HTTP2.pm
          podchecker lib/Unblock/HTTP2/Integration.pm
          podchecker lib/Unblock/HTTP2/Client.pm
          podchecker lib/Unblock/HTTP2/NativeABI.pm
          podchecker lib/Unblock/HTTP2/Server.pm
          podchecker lib/Unblock/HTTP2/Transaction.pm
